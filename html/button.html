<!-- 
    9. Button with disabled
You can disable a button:
<button type="submit" disabled>
    Submit
</button>
The user cannot normally interact with it.
This is useful when:
- Form is incomplete
- Data is being submitted
- User doesn't have permission
- Some condition isn't satisfied -->

<button
    type="submit"
    name="action"
    value="save">
    Save
</button>

<form action="/register" method="post">

    <label for="name">
        Name:
    </label>

    <input
        type="text"
        id="name"
        name="name"
        required
    >

    <br><br>

    <label for="email">
        Email:
    </label>

    <input
        type="email"
        id="email"
        name="email"
        required
    >

    <br><br>

    <button type="submit">
        Register
    </button>

    <button type="reset">
        Reset
    </button>

    <button type="button">
        Help
    </button>

</form>
