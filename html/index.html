Q. What is HTML?
Answer
HTML (HyperText Markup Language) is the standard markup language used to create the structure of web pages.
It defines elements like headings, paragraphs, images, links, forms, tables, and more.
Key point: HTML structures content; it does not control styling (CSS) or behavior (JavaScript).
Interview Question #2 ⭐⭐⭐⭐⭐
Q. Is HTML a programming language?
Answer
No.
HTML is a markup language, not a programming language.
Why?
A programming language usually supports concepts such as:
Variables
Loops
Conditions (if, else)
Functions
Decision-making
HTML has none of these.
It only describes the structure of a webpage.
Follow-up Interview Question ⭐⭐⭐⭐⭐
Then why is it called a language?
Because it has:
Rules (syntax)
Keywords (tags)
A standard format understood by browsers
But it cannot perform logic on its own.

Q. What is the latest version of HTML?⭐⭐⭐⭐⭐
Answer
The current standard is commonly referred to as HTML5.

3. <head>  ⭐⭐⭐⭐⭐
This is one of the most misunderstood tags.
The <head> does not display content on the webpage.
Instead, it stores information about the webpage.
Examples include:
Page title
Character encoding
Viewport settings
CSS links
JavaScript file links
SEO metadata
We'll explore all of these in upcoming lessons.

Q. What is the root element of an HTML document?
Answer
The <html> element.
Every HTML page has one root element that contains the <head> and <body> sections.
Interview Question #8
Q. Can an HTML document have two <html> tags?
Answer
No.
There should only be one root <html> element.

What are heading tags in HTML?
Answer:
Heading tags are semantic HTML elements used to define the hierarchical structure of headings and subheadings in a webpage.
HTML provides six heading levels, from <h1> to <h6>, where <h1> is the highest-level heading and <h6> is the lowest.

⭐ Interview Question 3
What is the difference between <h1> and <h6>?
Answer:
The main difference is their heading level in the document hierarchy.
<h1> represents the highest-level heading, while <h6> represents the lowest-level heading.
The browser also gives them different default styling, but developers should not choose heading levels purely based on font size.

⭐ Interview Question 4
Is <h1> always the biggest text on a webpage?
Answer:
No.
By default, browsers usually style <h1> larger than the other headings, but CSS can change its appearance.
⭐ Interview Question 6
⭐⭐⭐⭐⭐⭐What is semantic HTML?
Answer:
Semantic HTML means using HTML elements according to their meaning and purpose, rather than simply choosing elements based on their default appearance.
For example:
<h1>My Portfolio</h1> 
is semantic.
Whereas:
<div style="font-size: 32px;">
    My Portfolio
</div>
only creates visually large text and doesn't identify it as a heading.

⭐ Interview Questions — <p>
Q1. What is the purpose of <p>?
Answer:
<p> represents a paragraph of text in an HTML document.
Q2. Is <p> a block-level element?
Answer:
Yes. By default, <p> has display: block.
It normally starts on a new line and occupies the available width.
Q3. Can a <p> contain another <p>?
Answer:
No. Paragraph elements cannot be nested inside one another.
Don't write:
<p>
    This is outer
    <p>This is inner</p>
</p>
Instead:
<p>This is outer.</p>
<p>This is another paragraph.</p>
Q4. Can <p> contain other HTML elements?
Yes, but there are restrictions.
For example:
<p>
    I am learning <strong>HTML</strong>.
</p>
That's valid.
But you shouldn't put block-level structures such as another <p>, <div>, or heading inside a paragraph.
Q5. What happens when you press Enter inside HTML source code?
Suppose you write:
<p>
    Hello
    World
</p>
Does the browser show:
Hello
World
No.
Normally, HTML collapses ordinary whitespace.
You'll generally see:
Hello World
This is an important concept.
