<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4 Cards</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 50px;
        }

        .container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            width: 250px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            margin-bottom: 10px;
            color: #333;
        }

        .card p {
            color: #666;
            line-height: 1.5;
        }

        .card button {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
            cursor: pointer;
        }

        .card button:hover {
            background: #555;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">
            <h2>HTML</h2>
            <p>Learn the structure of web pages using HTML.</p>
            <button>Learn More</button>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>Style your websites and make them beautiful.</p>
            <button>Learn More</button>
        </div>

        <div class="card">
            <h2>JavaScript</h2>
            <p>Add functionality and interactivity to websites.</p>
            <button>Learn More</button>
        </div>

        <div class="card">
            <h2>React</h2>
            <p>Build modern and interactive user interfaces.</p>
            <button>Learn More</button>
        </div>

    </div>

</body>
</html>
