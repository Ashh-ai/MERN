<!--🖼️ <img> Tag — Interview Questions
First, remember the basic syntax:
<img src="profile.jpg" alt="Profile photo">
<img> is used to embed an image in an HTML document.
🟢 Basic Questions
1. What is the <img> tag?
Answer:
The <img> element is used to embed an image into an HTML document.
Example:
<img src="cat.jpg" alt="A cat">
2. Is <img> a paired or unpaired tag?
Answer:
<img> is a void element, so it doesn't have a closing tag.
Correct:
<img src="cat.jpg" alt="Cat">
Not:
<img></img>
3. What are the important attributes of <img>?
Common attributes include:
src
alt
width
height
loading
srcset
sizes
The two most fundamental are:
src → image source
alt → alternative text
4. What is the src attribute?
src specifies the URL/path of the image.
<img src="images/photo.jpg" alt="Photo">
Here:
src = images/photo.jpg
5. What is the alt attribute?
alt provides alternative text describing the image.
<img src="dog.jpg" alt="Golden retriever sitting in a park">
It is particularly important for:
Accessibility
Screen readers
Cases where the image cannot load
⭐ Very Important Interview Question
6. Why is alt important?
Answer:
The alt attribute provides a text alternative for an image.
It helps:
Screen-reader users understand the image.
Users when the image cannot be loaded.
Search engines understand the image's context.
🔥 Important Trap Question
9. Should every image have descriptive alt text?
Not necessarily.
For a meaningful image:
<img src="ceo.jpg" alt="Company CEO John Smith">
For a purely decorative image, use an empty alt:
<img src="line.png" alt="">
This tells screen readers that the image is decorative and can be ignored.
Don't write:
alt="image"
for every image. That's usually not useful.
🔥 Advanced <img> Questions
17. What is srcset?
