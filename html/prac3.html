<!-- 7. colspan
🔥 Very important interview topic.
colspan allows a cell to span multiple columns. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <table border = " black ">
        <!-- <caption>
<caption> provides a title/description for the table. -->
      <caption > dominoes pizza </caption> 
      <thead> <tr>
            <th rowspan ="2" > pizza type </th>
            <!-- rowspan allows a cell to span multiple rows. -->
            <th colspan ="2"> price </th>  
            <!-- colspan allows a cell to span multiple columns. -->
        </tr>
        <tr>
            <th> INR</th>
            <th> USD </th>
        </tr>
        </thead>    <!--  to wrap table header -->
        <tbody>
        <tr> 
        <td> corn pizza </td>
        <td> 89/- </td>
        <td> 0.3</td>    
        </tr>
        
        <td> volcano pizza </td>
        <td> 389/- </td>
        <td> 0.82</td>
        </tr>
      
        <td> cheese burst  </td>
        <td> 289/- </td>
        <td> 0.76</td>
        </tr> </tbody>  <!-- to wrap table body -->
    </table>
   <tfooter>
    <!-- use to show table footer -->
   </tfooter>
</body>
</html>
